<!doctype html>

<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Basic Quiz Form</title>

    <meta name="description" content="An HTML and CSS quiz form for WDD 130.">

    <meta name="author" content="Unity Santana Sunday">

    <link rel="stylesheet" href="../styles/quiz.css">
</head>

<body>
    <main>
        <h1>✅ Basic HTML and CSS Quiz</h1>

        <form action="">
            <fieldset>

                <div class="quiz-item">
                    <label for="q1">1. What does the acronym HTML stand for?</label>
                    <input type="text" id="q1" name="q1">
                </div>

                <div class="quiz-item">
                    <label for="q2">2. In your own words, explain what CSS is used for.</label>
                    <textarea id="q2" name="q2"></textarea>
                </div>

                <div class="quiz-item">
                    <label for="q3">3. Which of the following is a valid CSS comment?</label>

                    <select id="q3" name="q3">
                        <option value="" selected disabled>Choose One ...</option>
                        <option value="a">/* This is a comment */</option>
                        <option value="b">&lt;!-- This is a comment --&gt;</option>
                        <option value="c">// This is a comment</option>
                    </select>
                </div>

                <div class="quiz-item">
                    <label for="q4">4. What is the bottom margin given this declaration?</label>

                    <code>margin: 10px 5px 15px;</code>

                    <input type="number" id="q4" name="q4">
                </div>

                <button type="submit">Submit Quiz</button>

            </fieldset>
        </form>
    </main>
</body>

</html>
